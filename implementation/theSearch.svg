<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 470" width="1140" height="470" role="img" aria-label="CMA-ES draws candidate weight vectors from the archive's elites. Each candidate is scored by imagined rolls of T decisions from a shared set of starting states, giving imagined reward, imagined cost and a descriptor that selects its archive cell. Only the current best plays real episodes, which give the next starting states, move the limit level, refit the cost predictor, and decide the final choice under the cost limit.">
<title>CMA-ES draws candidate weight vectors from the archive's elites. Each candidate is scored by imagined rolls of T decisions from a shared set of starting states, giving imagined reward, imagined cost and a descriptor that selects its archive cell. Only the current best plays real episodes, which give the next starting states, move the limit level, refit the cost predictor, and decide the final choice under the cost limit.</title>
<style>
  .bg{fill:#ffffff}
  .band{fill:#eef1f6;stroke:none}
  .frozen{fill:#e7ebf1;stroke:#1b2330;stroke-width:1.5}
  .evolved{fill:#fdead2;stroke:#a94e08;stroke-width:2}
  .fitted{fill:#dce8f8;stroke:#1d5ca6;stroke-width:2}
  .plain{fill:#ffffff;stroke:#1b2330;stroke-width:1.2;stroke-dasharray:5 3}
  .edge{fill:none;stroke:#1b2330;stroke-width:1.5}
  .edge.mem{stroke:#a94e08}
  .head{fill:#1b2330}
  .head.mem{fill:#a94e08}
  .dot{fill:#1b2330}
  .grid{fill:none;stroke:#c6ced9;stroke-width:1}
  .cell{fill:#fdead2;stroke:#a94e08;stroke-width:1}
  .limit{fill:none;stroke:#1b2330;stroke-width:2}
  text{font-family:Inter,"Segoe UI","Helvetica Neue",Arial,sans-serif}
  .name{fill:#1b2330;font-size:13px;font-weight:600}
  .sub{fill:#586474;font-size:11.5px}
  .tag{fill:#586474;font-size:12px;font-weight:600}
  .m{fill:#1b2330;font-family:"STIX Two Text","Cambria Math","Times New Roman",serif;font-style:italic;font-size:15.5px}
  .m .r{font-style:normal}
  .m .s,.mi .s{font-size:10.5px}
  .mi{font-family:"STIX Two Text","Cambria Math","Times New Roman",serif;font-style:italic;font-size:15px}
  .words.lbl{paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
  .words.lbl.onband{stroke:#eef1f6}
  .words{fill:#1b2330;font-size:12px}
</style>
<rect class="bg" x="0" y="0" width="1140" height="470"/>
          <defs>
            <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker>
          </defs>

          <rect class="band" x="20" y="20" width="1100" height="235" rx="6"/>
          <text class="tag" x="40" y="42">Inside the world model: no real steps</text>
          <rect class="band" x="20" y="320" width="1100" height="130" rx="6"/>
          <text class="tag" x="40" y="342">In the simulator: every step counted</text>

          <!-- archive -->
          <text class="name" x="70" y="76">Archive <tspan class="mi" font-weight="400">M</tspan></text>
          <rect class="cell" x="70" y="175" width="30" height="30"/><rect class="cell" x="70" y="145" width="30" height="30"/>
          <rect class="cell" x="100" y="175" width="30" height="30"/><rect class="cell" x="100" y="145" width="30" height="30"/><rect class="cell" x="100" y="115" width="30" height="30"/>
          <rect class="cell" x="130" y="145" width="30" height="30"/><rect class="cell" x="130" y="115" width="30" height="30"/>
          <rect class="cell" x="160" y="115" width="30" height="30"/><rect class="cell" x="160" y="145" width="30" height="30"/><rect class="cell" x="160" y="85" width="30" height="30"/>
          <rect class="cell" x="190" y="85" width="30" height="30"/><rect class="cell" x="190" y="115" width="30" height="30"/>
          <rect class="cell" x="220" y="85" width="30" height="30"/>
          <path class="grid" d="M70 85H250M70 115H250M70 145H250M70 175H250M70 205H250M70 85V205M100 85V205M130 85V205M160 85V205M190 85V205M220 85V205M250 85V205"/>
          <rect class="limit" x="100" y="85" width="30" height="120"/>
          <text class="m" x="105" y="226" text-anchor="end" font-size="15">ℓ</text>
          <text class="sub" x="132" y="243"><tspan class="mi">β</tspan><tspan class="mi" font-size="10" dy="3">1</tspan><tspan dy="-3">: cost level, low to high</tspan></text>
          <text class="sub" x="54" y="145" text-anchor="middle" transform="rotate(-90 54 145)"><tspan class="mi">β</tspan><tspan class="mi" font-size="10" dy="3">2</tspan><tspan dy="-3">: manner of acting</tspan></text>

          <!-- CMA-ES -->
          <rect class="evolved" x="370" y="100" width="210" height="80" rx="4"/>
          <text class="name" x="475" y="123" text-anchor="middle">CMA-ES</text>
          <text class="m" x="475" y="148" text-anchor="middle">ω<tspan class="s" dy="4">i</tspan><tspan dy="-4"> ~ </tspan><tspan class="r">N</tspan>(μ, σ<tspan class="s" dy="-6">2</tspan><tspan dy="6">C)</tspan></text>
          <text class="m" x="475" y="170" text-anchor="middle" font-size="14">i = 1, …, λ</text>
          <path class="edge" d="M250 140H370" marker-end="url(#b2)"/>
          <text class="words lbl onband" x="310" y="132" text-anchor="middle">elites</text>

          <!-- scoring -->
          <rect class="frozen" x="700" y="85" width="400" height="115" rx="4"/>
          <text class="name" x="900" y="108" text-anchor="middle">Imagined rolls of T decisions</text>
          <text class="m" x="900" y="134" text-anchor="middle">ŝ<tspan class="s" dy="4">k+1</tspan><tspan dy="-4"> = f</tspan><tspan class="s" dy="4">θ</tspan><tspan dy="-4">(ŝ</tspan><tspan class="s" dy="4">k</tspan><tspan dy="-4">, a</tspan><tspan class="s" dy="4">k</tspan><tspan dy="-4">),   ŝ</tspan><tspan class="s" dy="4">0</tspan><tspan dy="-4"> ∈ D</tspan><tspan class="s" dy="4">0</tspan></text>
          <text class="sub" x="900" y="156" text-anchor="middle">each action from the proposal and the candidate adapter</text>
          <text class="m" x="900" y="183" text-anchor="middle">Ĵ<tspan class="s" dy="4">c</tspan><tspan dy="-4"> = </tspan><tspan class="r">mean</tspan> c<tspan class="s" dy="4">φ</tspan><tspan dy="-4">(ŝ</tspan><tspan class="s" dy="4">k</tspan><tspan dy="-4">),   Ĵ</tspan><tspan class="s" dy="4">r</tspan><tspan dy="-4"> = </tspan><tspan class="r">mean</tspan> r<tspan class="s" dy="4">θ</tspan><tspan dy="-4">(ŝ</tspan><tspan class="s" dy="4">k</tspan><tspan dy="-4">)</tspan></text>
          <path class="edge" d="M580 140H700" marker-end="url(#b2)"/>
          <text class="m lbl onband" x="640" y="131" text-anchor="middle">ω<tspan class="s" dy="4">i</tspan><tspan dy="-4"> ∈ ℝ</tspan><tspan class="s" dy="-6">n</tspan></text>
          <path class="edge" d="M900 85V56H235V85" marker-end="url(#b2)"/>
          <text class="m lbl onband" x="570" y="49" text-anchor="middle">Ĵ<tspan class="s" dy="4">r</tspan><tspan dy="-4">(ω</tspan><tspan class="s" dy="4">i</tspan><tspan dy="-4">),  Ĵ</tspan><tspan class="s" dy="4">c</tspan><tspan dy="-4">(ω</tspan><tspan class="s" dy="4">i</tspan><tspan dy="-4">),  β(ω</tspan><tspan class="s" dy="4">i</tspan><tspan dy="-4">)</tspan></text>

          <!-- simulator side -->
          <rect class="plain" x="420" y="355" width="200" height="78" rx="4"/>
          <text class="name" x="520" y="380" text-anchor="middle">Simulator</text>
          <text class="sub" x="520" y="400" text-anchor="middle">E real episodes a round,</text>
          <text class="sub" x="520" y="416" text-anchor="middle">giving trajectories τ</text>
          <path class="edge" d="M250 190H320V375H420" marker-end="url(#b2)"/>
          <text class="m lbl" x="328" y="293"><tspan class="r">current best</tspan> ω<tspan class="s" dy="-6">∗</tspan></text>

          <path class="edge" d="M465 355V308H115V207" marker-end="url(#b2)"/>
          <text class="m lbl" x="215" y="299" text-anchor="middle">J<tspan class="s" dy="4">c</tspan><tspan dy="-4"> </tspan><tspan class="r">moves</tspan> ℓ</text>

          <path class="edge" d="M520 355V285H760V200" marker-end="url(#b2)"/>
          <text class="m lbl" x="530" y="277">D<tspan class="s" dy="4">0</tspan><tspan dy="-4"> ← </tspan><tspan class="r">states</tspan>(τ) ∪ K</text>

          <rect class="fitted" x="820" y="355" width="260" height="78" rx="4"/>
          <text class="name" x="950" y="380" text-anchor="middle">Cost predictor, refitted</text>
          <text class="m" x="950" y="410" text-anchor="middle">c<tspan class="s" dy="4">φ</tspan><tspan dy="-4">(s) = c̄ · </tspan><tspan class="r">sigmoid</tspan>(w<tspan class="s" dy="-6">⊤</tspan><tspan dy="6">s + b)</tspan></text>
          <path class="edge" d="M620 394H820" marker-end="url(#b2)"/>
          <text class="m lbl onband" x="720" y="385" text-anchor="middle">φ ← <tspan class="r">fit</tspan>(τ)</text>
          <path class="edge" d="M950 355V200" marker-end="url(#b2)"/>
          <text class="m lbl" x="942" y="293" text-anchor="end">c<tspan class="s" dy="4">φ</tspan></text>

          <rect class="plain" x="40" y="355" width="230" height="78" rx="4"/>
          <text class="name" x="155" y="378" text-anchor="middle">Final choice</text>
          <text class="m" x="155" y="403" text-anchor="middle">ω<tspan class="s" dy="-6">†</tspan><tspan dy="6"> = </tspan><tspan class="r">argmax</tspan> J<tspan class="s" dy="4">r</tspan><tspan dy="-4">(ω)</tspan></text>
          <text class="m" x="155" y="424" text-anchor="middle" font-size="14"><tspan class="r">subject to</tspan> J<tspan class="s" dy="4">c</tspan><tspan dy="-4">(ω) ≤ d</tspan></text>
          <path class="edge" d="M420 412H270" marker-end="url(#b2)"/>
          <text class="m lbl onband" x="345" y="403" text-anchor="middle">J<tspan class="s" dy="4">r</tspan><tspan dy="-4">, J</tspan><tspan class="s" dy="4">c</tspan></text>
        </svg>
